<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DopamineGuard Options</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
      background: #f7f7f7;
      color: #111;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      font-size: 16px;
      padding: 12px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }

    #sites {
      height: 230px;
    }

    #message {
      height: 90px;
    }

    button {
      margin-top: 10px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
      color: green;
    }

    .mode-selector {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mode-option {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .mode-option input[type="radio"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .mode-option input[type="number"] {
      width: 58px;
      padding: 6px 8px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
    }

    .mode-option span {
      color: #555;
    }

    .small {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>DopamineGuard</h1>

    <div class="mode-selector">
      <label class="mode-option">
        <input type="radio" name="mode" id="modeActive">
        Blocking active
      </label>
      <label class="mode-option">
        <input type="radio" name="mode" id="modePause">
        Pause for
        <input type="number" id="pauseMinutes" min="1" max="60" value="3">
        <span>minutes</span>
      </label>
      <label class="mode-option">
        <input type="radio" name="mode" id="modeDisabled">
        Disabled
      </label>
    </div>
    <div id="pauseStatus" class="status"></div>

    <label for="sites">Blocked sites</label>
    <p class="small">One site per line. Example: youtube.com</p>
    <textarea id="sites"></textarea>

    <label for="message">Blocked page message</label>
    <textarea id="message"></textarea>

    <button id="save">Save settings</button>
    <button id="reset">Reset defaults</button>

    <div id="status" class="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
