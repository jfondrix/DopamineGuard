<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DopamineGuard Options</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
      background: #f7f7f7;
      color: #111;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      font-size: 16px;
      padding: 12px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }

    #sites {
      height: 230px;
    }

    #message {
      height: 90px;
    }

    button {
      margin-top: 10px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    .toggle {
      margin-top: 10px;
      font-size: 18px;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
      color: green;
    }

    .small {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>DopamineGuard</h1>

    <div class="toggle">
      <input type="checkbox" id="enabled">
      <label for="enabled" style="display:inline;font-weight:normal;">Enable blocking</label>
    </div>

    <label for="sites">Blocked sites</label>
    <p class="small">One site per line. Example: youtube.com</p>
    <textarea id="sites"></textarea>

    <label for="message">Blocked page message</label>
    <textarea id="message"></textarea>

    <button id="save">Save settings</button>
    <button id="reset">Reset defaults</button>

    <div id="status" class="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
